<?xml version="1.0" encoding="UTF-8"?>
<!-- Shadow Pong's GlowIcon art: a black court with a grey bar along its
     top, a white square paddle at each side, a white square ball with a
     grey shadow behind it. The AmiCradle Team's own drawing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="court" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/><stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8b8c0"/><stop offset="1" stop-color="#6c6c74"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="12" fill="url(#court)" stroke="#000" stroke-width="3"/>
  <rect x="8" y="8" width="112" height="16" rx="8" fill="url(#bar)"/>
  <rect x="16" y="40" width="9" height="42" fill="#ffffff"/>
  <rect x="103" y="62" width="9" height="42" fill="#ffffff"/>
  <rect x="62" y="64" width="12" height="12" fill="#5a5a62"/>
  <rect x="56" y="58" width="12" height="12" fill="#ffffff"/>
</svg>
